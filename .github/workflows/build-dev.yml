name: Build Dev APKs

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-android:
    name: Build Android Dev APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      # Enable ABI splits (arm64-v8a + armeabi-v7a)
      - name: Enable ABI splits
        run: |
          echo '
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "armeabi-v7a"
                      universalApk false
                  }
              }
          }
          ' >> android/app/build.gradle

      - name: Build Release APKs
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: android/app/build/outputs/apk/release/*arm64-v8a*.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-armeabi-v7a-apk
          path: android/app/build/outputs/apk/release/*armeabi-v7a*.apk