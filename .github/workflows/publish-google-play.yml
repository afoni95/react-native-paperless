name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal    # Internal testing
          - alpha       # Closed testing
          - beta        # Open testing
          - production  # Production release
        default: internal
      status:
        description: "Release status"
        required: true
        type: choice
        options:
          - draft
          - completed
        default: completed

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build AAB & Publish to Google Play
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pinned to Node 20 to match the F-Droid and release-APK builds
        # so all distribution channels are produced from identical tooling.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        # JDK 21 to match the F-Droid and release-APK builds (the F-Droid
        # buildserver only ships JDK 21; scripts/patch-jdk21.sh aligns the
        # toolchain in node_modules on all channels).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # Update version in app.json before prebuild
      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          # Calculate versionCode from version string (e.g. 1.2.3 -> 1002003)
          IFS='.' read -r major minor patch <<< "$VERSION"
          VERSION_CODE=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          # Update app.json
          jq --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
            '.expo.version = $v | .expo.android.versionCode = $vc' app.json > tmp.json && mv tmp.json app.json
          echo "Set version=$VERSION versionCode=$VERSION_CODE"

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Align JVM toolchain with F-Droid buildserver
        run: bash scripts/patch-jdk21.sh

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PATH=upload-keystore.jks node scripts/generate-key-properties.js

      # Build a signed Android App Bundle (AAB)
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # Publish to Google Play using the official action
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.paperlessnative.mobile
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}

      - name: Summary
        run: |
          {
            echo "### Deployment successful"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | com.paperlessnative.mobile |"
            echo "| Version | $VERSION (Code $VERSION_CODE) |"
            echo "| Track | ${{ github.event.inputs.track }} |"
            echo "| Status | ${{ github.event.inputs.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
