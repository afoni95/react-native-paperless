name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      track:
        description: "Play Store track"
        required: true
        type: choice
        options:
          - internal    # Internal testing
          - alpha       # Closed testing
          - beta        # Open testing
          - production  # Production release
        default: internal
      status:
        description: "Release status"
        required: true
        type: choice
        options:
          - draft
          - completed
        default: completed

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build AAB & Publish to Google Play
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # Update version in app.json before prebuild
      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          # Calculate versionCode from version string (e.g. 1.2.3 -> 1002003)
          IFS='.' read -r major minor patch <<< "$VERSION"
          VERSION_CODE=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          # Update app.json
          jq --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
            '.expo.version = $v | .expo.android.versionCode = $vc' app.json > tmp.json && mv tmp.json app.json
          echo "Set version=$VERSION versionCode=$VERSION_CODE"

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # Build a signed Android App Bundle (AAB)
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # Publish to Google Play using the official action
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.paperlessnative.mobile
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
