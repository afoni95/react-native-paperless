name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      # Enable ABI splits (arm64-v8a + armeabi-v7a)
      - name: Enable ABI splits
        run: |
          echo '
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "armeabi-v7a"
                      universalApk false
                  }
              }
          }
          ' >> android/app/build.gradle

      - name: Build Release APKs
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload modern-devices APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: android-modern-devices-apk
          path: android/app/build/outputs/apk/release/*arm64-v8a*.apk

      - name: Upload legacy-devices APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: android-legacy-devices-apk
          path: android/app/build/outputs/apk/release/*armeabi-v7a*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download modern-devices artifact
        uses: actions/download-artifact@v4
        with:
          name: android-modern-devices-apk
          path: artifacts/android

      - name: Download legacy-devices artifact
        uses: actions/download-artifact@v4
        with:
          name: android-legacy-devices-apk
          path: artifacts/android

      - name: Rename APKs with version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cd artifacts/android
          for file in *arm64-v8a*.apk; do
            mv "$file" "PaperlessNative-${VERSION}-modern-devices.apk"
          done
          for file in *armeabi-v7a*.apk; do
            mv "$file" "PaperlessNative-${VERSION}-legacy-devices.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/android/PaperlessNative-*.apk
