name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Pinned to Node 20 to match the F-Droid build environment
        # (fdroid-metadata.yml installs nodejs via nodesource setup_20.x).
        # Reproducible builds require both to produce an identical JS bundle.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        # Pinned to Java 21 to match the F-Droid buildserver, which has no
        # JDK 17 and patches all jvmToolchain(17)/VERSION_17 pins to 21
        # (see fdroid-metadata.yml prebuild). Reproducible builds require
        # both to compile the app with the same Java target.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Align Java toolchain with F-Droid build
        # Must stay identical to the sed commands in fdroid-metadata.yml.
        run: |
          sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
          sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g' node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
          sed -i 's/jvmToolchain(17)/jvmToolchain(21)/' node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: Write release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks"              >  android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"          >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"    >> android/key.properties

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Normalize release version
        id: normalize-version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          VERSION="${{ steps.normalize-version.outputs.version }}"
          cd artifacts/android
          for file in *.apk; do
            mv "$file" "PaperlessNative-${VERSION}.apk"
          done

      - name: Read F-Droid changelogs
        run: |
          BUILD_NUMBER="${{ steps.normalize-version.outputs.version }}"
          if [ -f "fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt" ]; then
            CHANGELOG_CONTENT=$(cat "fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt")
            echo "CHANGELOG_EN<<GHADELIMITER" >> $GITHUB_ENV
            echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
            echo "GHADELIMITER" >> $GITHUB_ENV
          else
            echo "CHANGELOG_EN=Release $BUILD_NUMBER" >> $GITHUB_ENV
          fi

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.normalize-version.outputs.version }}" "${{ github.sha }}" \
            -m "Release ${{ steps.normalize-version.outputs.version }}"
          git push origin "${{ steps.normalize-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.normalize-version.outputs.version }}
          name: "Paperless Native v${{ steps.normalize-version.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/android/PaperlessNative-*.apk
          body: |
            ## 📋 Changelog / Release Notes

            ${{ env.CHANGELOG_EN }}

            ## 📦 Download

            `PaperlessNative-${{ steps.normalize-version.outputs.version }}.apk`

            ## 📊 Build Info

            - **Version:** ${{ steps.normalize-version.outputs.version }}
            - **Commit:** ${{ github.sha }}

            ## 🔐 APK Signature Verification

            All APKs are signed with the official release certificate.

            **Expected SHA-256:**
            ```
            85:0E:A0:FA:08:1D:5B:81:41:66:9E:75:16:FA:CB:FE:72:B2:EC:02:E2:BA:33:54:9C:F4:85:8C:5B:7D:23:97
            ```

            Verify with [AppVerifier](https://github.com/soupslurpr/AppVerifier) (Android app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
