name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    # The NDK-compiled libs (appmodules, expo-modules-core, codegen) embed
    # absolute source and Gradle-cache paths into the .so files. The F-Droid
    # buildserver builds as user "vagrant" in /home/vagrant/build/<appid>, so
    # this build must run from the identical path with the identical
    # GRADLE_USER_HOME or the native libs won't byte-match during
    # reproducible-build verification.
    env:
      BUILD_DIR: /home/vagrant/build/com.paperlessnative.mobile
      GRADLE_USER_HOME: /home/vagrant/.gradle
    defaults:
      run:
        working-directory: /home/vagrant/build/com.paperlessnative.mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror checkout at F-Droid buildserver path
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown -R "$(id -un)" /home/vagrant
          cp -a "$GITHUB_WORKSPACE" "$BUILD_DIR"

      - name: Setup Node.js
        # Pinned to Node 20 to match the F-Droid build environment
        # (fdroid-metadata.yml installs nodejs via nodesource setup_20.x).
        # Reproducible builds require both to produce an identical JS bundle.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        # JDK 21 to match the F-Droid buildserver (Debian trixie ships only
        # JDK 21). The toolchain in node_modules is patched to 21 by
        # scripts/patch-jdk21.sh below — the F-Droid recipe runs the same
        # script, so both builds produce byte-identical bytecode.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            /home/vagrant/.gradle/caches
            /home/vagrant/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Generate native project
        # --no-install matches the F-Droid prebuild invocation exactly.
        run: npx expo prebuild --platform android --clean --no-install

      - name: Align JVM toolchain with F-Droid buildserver
        run: bash scripts/patch-jdk21.sh

      - name: Write release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks"              >  android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"          >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"    >> android/key.properties

      - name: Build Release APK
        working-directory: /home/vagrant/build/com.paperlessnative.mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: /home/vagrant/build/com.paperlessnative.mobile/android/app/build/outputs/apk/release/*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Normalize release version
        id: normalize-version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          VERSION="${{ steps.normalize-version.outputs.version }}"
          cd artifacts/android
          for file in *.apk; do
            mv "$file" "PaperlessNative-${VERSION}.apk"
          done

      - name: Read F-Droid changelogs
        run: |
          # Changelog files are keyed by Android versionCode, not version name.
          BUILD_NUMBER=$(jq -r '.expo.android.versionCode' app.json)
          if [ -f "fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt" ]; then
            CHANGELOG_CONTENT=$(cat "fastlane/metadata/android/en-US/changelogs/${BUILD_NUMBER}.txt")
            echo "CHANGELOG_EN<<GHADELIMITER" >> $GITHUB_ENV
            echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
            echo "GHADELIMITER" >> $GITHUB_ENV
          else
            echo "CHANGELOG_EN=Release ${{ steps.normalize-version.outputs.version }}" >> $GITHUB_ENV
          fi

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.normalize-version.outputs.version }}" "${{ github.sha }}" \
            -m "Release ${{ steps.normalize-version.outputs.version }}"
          git push origin "${{ steps.normalize-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.normalize-version.outputs.version }}
          name: "Paperless Native v${{ steps.normalize-version.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/android/PaperlessNative-*.apk
          body: |
            ## 📋 Changelog / Release Notes

            ${{ env.CHANGELOG_EN }}

            ## 📦 Download

            `PaperlessNative-${{ steps.normalize-version.outputs.version }}.apk`

            ## 📊 Build Info

            - **Version:** ${{ steps.normalize-version.outputs.version }}
            - **Commit:** ${{ github.sha }}

            ## 🔐 APK Signature Verification

            All APKs are signed with the official release certificate.

            **Expected SHA-256:**
            ```
            85:0E:A0:FA:08:1D:5B:81:41:66:9E:75:16:FA:CB:FE:72:B2:EC:02:E2:BA:33:54:9C:F4:85:8C:5B:7D:23:97
            ```

            Verify with [AppVerifier](https://github.com/soupslurpr/AppVerifier) (Android app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
