name: Validate Signing Keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate keystore
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks

      - name: Validate keystore and fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing keystore secrets. Ensure ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are set."
            exit 1
          fi

          KEYTOOL_OUTPUT=""
          set +e
          KEYTOOL_OUTPUT=$(keytool -list -v \
            -keystore upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)
          STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            if [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
              KEYTOOL_OUTPUT=$(keytool -list -v \
                -keystore upload-keystore.jks \
                -alias "$ANDROID_KEY_ALIAS" \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                -keypass "$ANDROID_KEY_PASSWORD" 2>&1) || {
                  echo "keytool failed. Output:"
                  echo "$KEYTOOL_OUTPUT"
                  exit 1
                }
            else
              echo "keytool failed. Output:"
              echo "$KEYTOOL_OUTPUT"
              echo "If your key password differs from the store password, set ANDROID_KEY_PASSWORD."
              exit 1
            fi
          fi

          RAW_LINE=$(echo "$KEYTOOL_OUTPUT" | grep -m 1 -i "SHA256:")

          if [ -z "$RAW_LINE" ]; then
            echo "SHA-256 fingerprint not found in keytool output."
            exit 1
          fi

          RAW_FINGERPRINT=$(echo "$RAW_LINE" | awk -F 'SHA256:' '{print $2}')
          NORMALIZED_FINGERPRINT=$(echo "$RAW_FINGERPRINT" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')

          echo "Computed SHA-256 fingerprint:"
          echo "$RAW_FINGERPRINT"
          echo "fingerprint=$NORMALIZED_FINGERPRINT" >> "$GITHUB_OUTPUT"

          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
            if [ "$EXPECTED" != "$NORMALIZED_FINGERPRINT" ]; then
              echo "Fingerprint mismatch."
              echo "Expected: $EXPECTED"
              echo "Actual:   $NORMALIZED_FINGERPRINT"
              exit 1
            fi
            echo "Fingerprint matches expected value."
          else
            echo "No expected fingerprint provided (SIGNING_CERT_SHA256). Skipping comparison."
          fi
