name: Diagnose Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose keystore secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "=== Decoding keystore ==="
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/test-keystore.jks
          echo "Keystore size: $(wc -c < /tmp/test-keystore.jks) bytes"

      - name: Inspect keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Keystore type and entries ==="
          keytool -list \
            -keystore /tmp/test-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -v 2>&1 | head -20

          echo ""
          echo "=== Key entry for alias ==="
          keytool -list \
            -keystore /tmp/test-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -v 2>&1

          echo ""
          echo "=== Verify key password matches ==="
          keytool -keypasswd \
            -keystore /tmp/test-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -new "$KEY_PASSWORD" 2>&1 \
            && echo "KEY_PASSWORD: OK" \
            || echo "KEY_PASSWORD: WRONG (Cannot recover key)"
