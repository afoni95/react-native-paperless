<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperless Native</title>
    <style>
        :root {
            --bg: #0f1720;
            --surface: #1a2332;
            --primary: #4fc3f7;
            --text: #e0e0e0;
            --text-muted: #90a4ae;
            --border: #263545;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            padding: 4rem 1.5rem 2rem;
            max-width: 640px;
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .hero .tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .hero .badges {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--primary);
        }

        .screenshots {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0 1.5rem 2rem;
            max-width: 900px;
            scroll-snap-type: x mandatory;
        }

        .screenshots img {
            height: 360px;
            border-radius: 12px;
            border: 1px solid var(--border);
            scroll-snap-align: center;
            flex-shrink: 0;
        }

        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            padding: 1rem 1.5rem 3rem;
            max-width: 640px;
            width: 100%;
        }

        .nav-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: border-color 0.2s, transform 0.15s;
        }

        .nav-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-card .icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .nav-card .label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .nav-card .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        footer {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            width: 100%;
            margin-top: auto;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Paperless Companion</h1>
        <p class="tagline">A mobile client for your self-hosted Paperless-ngx instance</p>
        <div class="badges">
            <span class="badge">React Native</span>
            <span class="badge">Open Source</span>
        </div>
    </section>

    <div class="screenshots">
        <img src="https://raw.githubusercontent.com/afoni95/react-native-paperless/main/public/vertical/dashboard_dark.jpeg" alt="Dashboard">
        <img src="https://raw.githubusercontent.com/afoni95/react-native-paperless/main/public/vertical/documents_dark.jpeg" alt="Documents">
        <img src="https://raw.githubusercontent.com/afoni95/react-native-paperless/main/public/vertical/upload_dark.jpeg" alt="Upload">
        <img src="https://raw.githubusercontent.com/afoni95/react-native-paperless/main/public/vertical/tags_dark.jpeg" alt="Tags">
        <img src="https://raw.githubusercontent.com/afoni95/react-native-paperless/main/public/vertical/settings_dark.jpeg" alt="Settings">
    </div>

    <nav class="nav-cards">
        <a class="nav-card" href="PRIVACY_POLICY">
            <span class="icon">🔒</span>
            <div>
                <div class="label">Privacy Policy</div>
                <div class="desc">How the app handles your data</div>
            </div>
        </a>
        <a class="nav-card" href="https://github.com/afoni95/react-native-paperless">
            <span class="icon">📦</span>
            <div>
                <div class="label">GitHub Repository</div>
                <div class="desc">Source code &amp; contributions</div>
            </div>
        </a>
    </nav>

    <footer>
        &copy; 2026 Paperless Companion &middot; Licensed under <a href="https://github.com/afoni95/react-native-paperless/blob/main/LICENCE">GPLv3</a>
    </footer>

</body>
</html>
